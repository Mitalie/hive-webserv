# Test configuration for custom error pages

server {
	listen 127.0.0.1 8080;
	server_name localhost;
	error_page 404 /home/thedapperfoxtrot/Documents/webserv/testdata/errors/404.html;
	error_page 500 /home/thedapperfoxtrot/Documents/webserv/testdata/errors/500.html;
	client_max_body_size 1048576;

	location / {
		root /home/thedapperfoxtrot/Documents/webserv/testdata;
		index index.html;
		autoindex on;
		methods GET POST;
	}
}
