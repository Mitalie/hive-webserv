# Example webserv configuration file
# Inspired by NGINX

server {                                   # Start a server block
	listen 127.0.0.1 8080;                 # Listen on IP 127.0.0.1 and port 8080
	server_name localhost;                 # Respond to requests for 'localhost'
	error_page 404 /errors/404.html;       # Serve this file for 404 errors
	client_max_body_size 1048576;          # Limit client request body to 1 megabyte

	location / {                           # Route for '/'
		root /var/www/html;                # Files served from this directory
		index index.html;                  # Default file if directory is requested
		autoindex off;                     # Disable directory listing
		methods GET POST;                  # Allow only GET and POST methods
	}

	location /images/ {                    # Route for '/images'
		root /var/www/images;              # Files served from this directory
		autoindex on;                      # Enable directory listing
		methods GET;                       # Only GET requests allowed
	}

	location /upload/ {                    # Route for '/upload'
		root /var/www/uploads;             # Files served from this directory
		methods POST;                      # Only POST requests allowed
		upload_store /var/www/uploads;     # Uploaded files saved here
	}

	location /cgi-bin/ {                   # Route for '/cgi-bin'
		root /var/www/cgi-bin;             # Files served from this directory
		cgi_ext .php /usr/bin/php-cgi;
		cgi_ext .py /usr/bin/python;
		cgi_ext .pl /bin/perl;
		cgi_ext .rb /bin/ruby;
		methods GET POST;                  # Allow GET and POST for CGI
	}

	location /redirect/ {                  # Route for '/redirect'
		redirect 301 http://example.com/;  # Redirect to example.com with HTTP 301
	}
}

server {                                   # Start another server block
	listen 0.0.0.0 8081;                   # Listen on all interfaces, port 8081
	server_name testsite.com;              # Respond to requests for 'testsite.com'
	error_page 500 /errors/500.html;       # Serve this file for 500 errors
	client_max_body_size 2097152;          # Limit client request body to 2 megabytes

	location / {                           # Route for '/'
		root /srv/testsite;                # Files served from this directory
		index home.html;                   # Default file if directory is requested
		autoindex off;                     # Disable directory listing
		methods GET;                       # Only GET requests allowed
	}
}

