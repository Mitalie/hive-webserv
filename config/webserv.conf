# Example webserv configuration file
# Inspired by NGINX

server
{
	listen					127.0.0.1 8080;			# IPv4 address and port for incoming connections
	server_name				localhost;				# Virtual server name for Host header matching

	error_page				400	www/errors/400.html;# Bad Request (Malformed HTTP request)
	error_page				403	www/errors/403.html;# Forbidden (Access denied)
	error_page				404	www/errors/404.html;# Not Found (Resource does not exist)
	error_page				413	www/errors/413.html;# Payload Too Large (Exceeds max body size limit)
	error_page				415	www/errors/415.html;# Unsupported Media Type (Invalid content type)
	error_page				500	www/errors/500.html;# Internal Server Error (Server logic failure)
	error_page				502	www/errors/502.html;# Bad Gateway (CGI process crash)
	error_page				503	www/errors/503.html;# Service Unavailable (Server overload)
	error_page				504	www/errors/504.html;# Gateway Timeout (CGI infinite loop)

	client_max_body_size	1048576;				# Maximum permitted size of the client request body (1MB)

	location /
	{
		root				www/html;				# Base directory for file lookups
		index				index.html;				# Default file to serve for directory requests
		autoindex			off;					# Disable automated directory listing
		methods				GET POST DELETE;		# Allowed HTTP verbs for this context
	}

	location /images/
	{
		root				www/images;				# Storage path for static image assets
		autoindex			on;						# Enable automated directory listing
		methods				GET;					# Restrict to read-only access
	}

	location /upload/
	{
		root				www/uploads;			# Target directory for uploaded content
		autoindex			on;						# Allow browsing of uploaded files
		client_max_body_size	1048576;			# Per-route body limit enforcement (1MB)
		methods				GET POST DELETE;		# Support for file management operations
		upload_store		www/uploads;			# Internal path for multi-part data storage
	}

	location /cgi-bin/
	{
		root				www/cgi-bin;			# Script execution directory
		cgi_ext				.php /usr/bin/php-cgi;	# PHP-CGI binary mapping
		cgi_ext				.py /usr/bin/python3;	# Python 3 interpreter mapping
		cgi_ext				.pl /bin/perl;			# Perl interpreter mapping
		cgi_ext				.rb /bin/ruby;			# Ruby interpreter mapping
		cgi_ext				.sh /bin/bash;			# Bourne Again Shell mapping
		methods				GET POST;				# Methods supported by the CGI gateway
		#cgi_broken_pathinfo;						# Support 42 cgi_tester with broken SCRIPT_NAME/PATH_INFO handling. No argument, enabled if present.
	}

	location /redirect/
	{
		methods				GET;					# Redirect only supports GET
		redirect			301 http://example.com/;# External URL redirection with status code
	}
}

server
{
	listen					127.0.0.1 8081;			# Virtual host listener on secondary port
	server_name				testsite.com;			# Primary domain for this port context
	error_page				500 www/errors/500.html;# Global error handling for site failures
	client_max_body_size	2097152;				# Increased payload limit for site1 (2MB)

	location /
	{
		root				www/html;				# Shared HTML root directory
		index				site1.html;				# Specific landing page for testsite.com
		autoindex			off;					# Protection of directory structure
		methods				GET;					# Enforce read-only policy
	}
}

server
{
	listen					127.0.0.1 8081;			# Shared listener for name-based virtual hosting
	server_name				testsite2.com;			# Secondary domain on the same IP:Port
	error_page				500 www/errors/500.html;# Standardized error response
	client_max_body_size	2097152;				# Increased payload limit for site2 (2MB)

	location /
	{
		root				www/site2;				# Isolated root for testsite2
		index				site2.html;				# Specific landing page for testsite2.com
		autoindex			off;					# Protection of directory structure
		methods				GET;					# Enforce read-only policy
	}
}
