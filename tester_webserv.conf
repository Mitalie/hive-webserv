server {
	listen 127.0.0.1 8080;
	server_name localhost;
	client_max_body_size 100000000;

	location / {
		root .;
		methods GET;
		autoindex on;
	}

	location /put_test/ {
		root ./YoupiBanane/put_test;
		methods PUT;
		upload_store /var/www/uploads;
	}

	location /directory/ {
		root ./YoupiBanane;
		methods GET POST;
		index youpi.bad_extension;
		cgi_ext .bla ./ubuntu_cgi_tester;
		cgi_broken_pathinfo;
	}

	location /post_body {
		root ./YoupiBanane/post_test.sh;
		methods POST;
		cgi_ext .sh /bin/sh;
		client_max_body_size 100;
	}
}
